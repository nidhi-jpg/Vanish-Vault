<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VanishVault – Search. Identify. Reunite.</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css">
    <meta name="theme-color" content="#0d6efd">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="/">VanishVault</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="/search/">Search</a></li>
        <li class="nav-item"><a class="nav-link" href="/found/">Found</a></li>
        <li class="nav-item"><a class="nav-link" href="/reports/report-missing/">Report Missing</a></li>
        <li class="nav-item"><a class="nav-link" href="/about/">About</a></li>
        <li class="nav-item"><a class="nav-link" href="/contact/">Contact</a></li>
      </ul>
      <ul class="navbar-nav">
        {% if user.is_authenticated %}
          <li class="nav-item"><span class="nav-link">Hi {{ user.username }}</span></li>
          <li class="nav-item"><a class="btn btn-outline-secondary btn-sm" href="/accounts/logout/">Logout</a></li>
        {% else %}
          <li class="nav-item"><a class="btn btn-primary btn-sm" href="/accounts/login/">Volunteer Login</a></li>
        {% endif %}
      </ul>
    </div>
  </div>
  </nav>

  <main class="container py-4">
    {% block content %}{% endblock %}
  </main>

  <footer class="bg-light border-top py-3 mt-auto">
    <div class="container text-center small">
      © {{ now|date:'Y' }} VanishVault · Search · Identify · Reunite
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
