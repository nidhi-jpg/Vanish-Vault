{% extends 'base.html' %}
{% block content %}
<h4 class="mb-3">Report a Missing Person</h4>
<form method="post" enctype="multipart/form-data" class="row g-3">
  {% csrf_token %}
  {{ form.as_p }}
  <div class="col-12">
    <button class="btn btn-primary" type="submit">Submit</button>
  </div>
</form>
{% endblock %}
