{% extends 'base.html' %}
{% block content %}
<h4 class="mb-3">Search Missing Persons</h4>
<form class="row g-2 mb-3" method="get">
  <div class="col-12 col-md-4">
    <input class="form-control" type="text" name="q" value="{{ query }}" placeholder="Name">
  </div>
  <div class="col-12 col-md-3">
    <input class="form-control" type="text" name="location" value="{{ location_val }}" placeholder="Last seen location">
  </div>
  <div class="col-6 col-md-2">
    <input class="form-control" type="number" name="age_min" value="{{ age_min_val }}" placeholder="Age min">
  </div>
  <div class="col-6 col-md-2">
    <input class="form-control" type="number" name="age_max" value="{{ age_max_val }}" placeholder="Age max">
  </div>
  <div class="col-12 col-md-3">
    <select class="form-select" name="gender">
      <option value="" {% if not gender_val %}selected{% endif %}>Any Gender</option>
      <option value="male" {% if gender_val == 'male' %}selected{% endif %}>Male</option>
      <option value="female" {% if gender_val == 'female' %}selected{% endif %}>Female</option>
      <option value="other" {% if gender_val == 'other' %}selected{% endif %}>Other</option>
    </select>
  </div>
  <div class="col-12 col-md-2">
    <button class="btn btn-primary w-100" type="submit">Search</button>
  </div>
  </form>

<div class="row g-3">
  {% for p in results %}
  <div class="col-6 col-md-4 col-lg-3">
    <div class="card h-100">
      <a href="{% url 'missing_detail' p.id %}" class="text-decoration-none text-reset">
        {% if p.photo %}<img src="{{ p.photo.url }}" class="card-img-top" alt="{{ p.full_name }}">{% endif %}
        <div class="card-body p-2">
          <div class="fw-semibold">{{ p.full_name }}</div>
          <div class="text-muted small">{{ p.last_seen_location }}</div>
        </div>
      </a>
    </div>
  </div>
  {% empty %}
  <div class="text-muted">No results found.</div>
  {% endfor %}
</div>
{% endblock %}
